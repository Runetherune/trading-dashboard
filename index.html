<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Trading Agent Dashboard</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 20px; color: #fff; margin-bottom: 4px; }
  .meta { color: #888; font-size: 13px; margin-bottom: 24px; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
  .card { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 10px; padding: 16px 20px; min-width: 220px; }
  .card h2 { font-size: 14px; color: #aaa; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .role { font-size: 11px; color: #666; margin-bottom: 8px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .stat-row .label { color: #999; }
  .pnl-pos { color: #4ade80; font-weight: 600; }
  .pnl-neg { color: #f87171; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #888; font-weight: 500; padding: 8px 10px; border-bottom: 1px solid #2a2e38; position: sticky; top: 0; background: #0f1115; }
  td { padding: 8px 10px; border-bottom: 1px solid #1a1d24; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .badge-win { background: #14532d; color: #4ade80; }
  .badge-loss { background: #450a0a; color: #f87171; }
  .badge-pending { background: #292524; color: #a8a29e; }
  .dir-long { color: #4ade80; }
  .dir-short { color: #f87171; }
  .filters { margin-bottom: 12px; display: flex; gap: 8px; }
  select { background: #1a1d24; color: #e6e6e6; border: 1px solid #2a2e38; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
</style>
</head>
<body>
<h1>Trading Agent Dashboard</h1>
<div class="meta">Genereret: 2026-08-28 15:01 UTC &middot; 0 signaler i alt paa tvaers af 0 konto(er)</div>

<div class="cards" id="cards"></div>

<div class="filters">
  <select id="acctFilter"><option value="">Alle konti</option></select>
  <select id="stratFilter"><option value="">Alle strategier</option></select>
  <select id="outcomeFilter">
    <option value="">Alle udfald</option>
    <option value="win">Kun vindere</option>
    <option value="loss">Kun tabere</option>
    <option value="pending">Kun aabne/ikke-graderede</option>
  </select>
</div>

<table id="tradesTable">
  <thead>
    <tr>
      <th>Tidspunkt</th><th>Konto</th><th>Symbol</th><th>Strategi</th><th>Retning</th>
      <th>Entry</th><th>SL</th><th>TP</th><th>Lot</th><th>Risk%</th><th>Udfald</th><th>PnL ($)</th><th>Status</th>
    </tr>
  </thead>
  <tbody id="tradesBody"></tbody>
</table>

<h2 style="font-size:16px;color:#fff;margin-top:32px;">Aktivitetslog (hvad scanneren tjekkede/fandt)</h2>
<div id="activityLog" style="max-height:400px;overflow-y:auto;border:1px solid #2a2e38;border-radius:8px;"></div>

<script>
const trades = [];
const summary = {};
const activity = [];

function fmtPnl(v) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  const cls = v >= 0 ? 'pnl-pos' : 'pnl-neg';
  const sign = v >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}$${v.toFixed(2)}</span>`;
}

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  for (const [acct, s] of Object.entries(summary)) {
    const pnlClass = s.total_pnl_usd >= 0 ? 'pnl-pos' : 'pnl-neg';
    container.innerHTML += `
      <div class="card">
        <h2>${acct}</h2>
        <div class="role">${s.role}</div>
        <div class="stat-row"><span class="label">Signaler</span><span>${s.total_signals}</span></div>
        <div class="stat-row"><span class="label">Lukkede trades</span><span>${s.closed_trades}</span></div>
        <div class="stat-row"><span class="label">Aabne/afventer</span><span>${s.open_or_pending}</span></div>
        <div class="stat-row"><span class="label">Vindere</span><span>${s.wins}</span></div>
        <div class="stat-row"><span class="label">Tabere</span><span>${s.losses}</span></div>
        <div class="stat-row"><span class="label">Winrate</span><span>${s.winrate !== null ? s.winrate + '%' : '-'}</span></div>
        <div class="stat-row"><span class="label">Total PnL</span><span class="${pnlClass}">$${s.total_pnl_usd.toFixed(2)}</span></div>
      </div>`;
  }
}

function populateFilters() {
  const accts = [...new Set(trades.map(t => t.account))];
  const strats = [...new Set(trades.map(t => t.strategy))];
  const acctSel = document.getElementById('acctFilter');
  const stratSel = document.getElementById('stratFilter');
  accts.forEach(a => acctSel.innerHTML += `<option value="${a}">${a}</option>`);
  strats.forEach(s => stratSel.innerHTML += `<option value="${s}">${s}</option>`);
}

function renderTable() {
  const acctF = document.getElementById('acctFilter').value;
  const stratF = document.getElementById('stratFilter').value;
  const outF = document.getElementById('outcomeFilter').value;
  const body = document.getElementById('tradesBody');
  body.innerHTML = '';

  trades.filter(t => {
    if (acctF && t.account !== acctF) return false;
    if (stratF && t.strategy !== stratF) return false;
    if (outF === 'win' && t.outcome !== 'win') return false;
    if (outF === 'loss' && t.outcome !== 'loss') return false;
    if (outF === 'pending' && t.outcome) return false;
    return true;
  }).forEach(t => {
    const outcomeBadge = t.outcome === 'win' ? '<span class="badge badge-win">WIN</span>'
      : t.outcome === 'loss' ? '<span class="badge badge-loss">LOSS</span>'
      : '<span class="badge badge-pending">-</span>';
    const dirClass = t.direction === 'long' ? 'dir-long' : 'dir-short';
    body.innerHTML += `<tr>
      <td>${(t.entry_time || '').substring(0,16).replace('T',' ')}</td>
      <td>${t.account}</td>
      <td>${t.symbol}</td>
      <td>${t.strategy}</td>
      <td class="${dirClass}">${t.direction}</td>
      <td>${t.entry_price ? t.entry_price.toFixed(2) : '-'}</td>
      <td>${t.sl ? t.sl.toFixed(2) : '-'}</td>
      <td>${t.tp ? t.tp.toFixed(2) : '-'}</td>
      <td>${t.lot_size ?? '-'}</td>
      <td>${t.risk_pct_used ?? '-'}%</td>
      <td>${outcomeBadge}</td>
      <td>${fmtPnl(t.pnl_usd)}</td>
      <td>${t.status || '-'}</td>
    </tr>`;
  });
}

document.getElementById('acctFilter').addEventListener('change', renderTable);
document.getElementById('stratFilter').addEventListener('change', renderTable);
document.getElementById('outcomeFilter').addEventListener('change', renderTable);

renderCards();
populateFilters();
renderTable();

function renderActivity() {
  const container = document.getElementById('activityLog');
  if (!activity.length) {
    container.innerHTML = '<div style="padding:16px;color:#666;">Ingen aktivitet logget endnu.</div>';
    return;
  }
  container.innerHTML = activity.map(a => `
    <div style="padding:10px 14px;border-bottom:1px solid #1a1d24;">
      <div style="font-size:11px;color:#666;">${(a.logged_at || '').substring(0,16).replace('T',' ')} UTC</div>
      <div style="font-size:13px;margin-top:2px;">${a.note || ''}</div>
      <div style="font-size:11px;color:#888;margin-top:2px;">${a.symbols_checked || ''} ${a.signals_found ? '&middot; ' + a.signals_found + ' signal(er) fundet' : ''}</div>
    </div>`).join('');
}
renderActivity();
</script>
</body>
</html>
